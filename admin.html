<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bagbigbook — Live & Invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#F2EEE3;
    --paper-2:#E7E0CC;
    --white:#FFFDF9;
    --ink:#26241F;
    --ink-soft:#726C5E;
    --indigo:#2E3A52;
    --indigo-2:#425374;
    --amber:#C96A4B;
    --amber-ink:#FFF6EF;
    --sage:#5C7A5B;
    --sage-bg:#E4EBDF;
    --rust:#B5502D;
    --rust-bg:#F3DFD4;
    --line:#D8D0BA;
    --radius:14px;
    --font-display:'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-ui:'Work Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper-2); color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  #shell{
    max-width:460px; margin:0 auto; min-height:100vh; background:var(--paper);
    position:relative; box-shadow:0 0 40px rgba(0,0,0,.08);
    display:flex; flex-direction:column;
  }
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--line); padding:14px 16px 12px;
  }
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .mark{display:flex; align-items:flex-end; gap:2px; height:22px;}
  .mark span{width:5px; display:block; border-radius:2px 2px 0 0;}
  .mark span:nth-child(1){height:12px; background:var(--indigo);}
  .mark span:nth-child(2){height:20px; background:var(--amber);}
  .mark span:nth-child(3){height:16px; background:var(--sage);}
  .mark span:nth-child(4){height:22px; background:var(--indigo-2);}
  .brand h1{font-family:var(--font-display); font-size:1.28rem; font-weight:700; margin:0; letter-spacing:.2px;}
  .brand .tag{font-size:.72rem; color:var(--ink-soft); margin-top:1px;}
  .modeToggle{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--white); flex-shrink:0;}
  .modeToggle button{border:none; background:transparent; font-family:var(--font-ui); font-size:.72rem; font-weight:600; padding:6px 10px; cursor:pointer; color:var(--ink-soft);}
  .modeToggle button.active{background:var(--indigo); color:var(--white);}

  main{flex:1; padding:16px 16px 100px;}
  .empty{color:var(--ink-soft); font-size:.88rem; line-height:1.5; padding:10px 2px;}

  h2.sectionTitle{font-family:var(--font-display); font-size:1.15rem; font-weight:600; margin:2px 0 12px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .card + .card{margin-top:0;}
  .stepLabel{font-size:.78rem; color:var(--ink-soft); font-weight:600; margin-bottom:8px;}
  label.field{display:block; font-size:.8rem; color:var(--ink-soft); margin:10px 0 4px;}
  label.field:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=tel], textarea, select{
    width:100%; padding:.62em .8em; border:1px solid var(--line); border-radius:10px;
    background:var(--white); font-family:var(--font-ui); font-size:.94rem; color:var(--ink);
  }
  textarea{resize:vertical; min-height:80px; font-family:var(--font-mono); font-size:.82rem; line-height:1.5;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--indigo-2); outline-offset:1px;}

  .autowrap{position:relative;}
  .suggest{
    position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--white);
    border:1px solid var(--line); border-radius:10px; max-height:220px; overflow-y:auto;
    box-shadow:0 8px 24px rgba(38,36,31,.14); z-index:40;
  }
  .suggest button{
    display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; border:none;
    background:none; padding:9px 12px; font-family:var(--font-ui); font-size:.88rem; cursor:pointer; color:var(--ink);
  }
  .suggest button:hover{background:var(--paper);}
  .suggest .p{color:var(--ink-soft); font-family:var(--font-mono); font-size:.8rem; white-space:nowrap;}
  .hint{font-size:.76rem; color:var(--ink-soft); margin-top:5px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:.68em 1em; font-family:var(--font-ui); font-weight:600; font-size:.9rem; cursor:pointer; text-decoration:none;}
  .btn-primary{background:var(--indigo); color:var(--white); width:100%;}
  .btn-primary:hover{background:var(--indigo-2);}
  .btn-amber{background:var(--amber); color:var(--amber-ink); width:100%;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-sm{padding:.4em .75em; font-size:.8rem;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-row .btn{flex:1;}
  .iconbtn{background:none; border:none; cursor:pointer; color:var(--rust); font-size:1rem; line-height:1; padding:2px 4px;}

  .pill{display:inline-block; padding:.22em .75em; border-radius:999px; font-size:.74rem; font-weight:700;}
  .pill-unpaid{background:var(--rust-bg); color:var(--rust);}
  .pill-paid{background:var(--sage-bg); color:var(--sage);}
  .pill-dp{background:#F6E6C8; color:#8A5A15;}

  .lineItem{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:.88rem;}
  .lineItem:last-child{border-bottom:none;}
  .lineItem .name{flex:1;}
  .lineItem .sub{color:var(--ink-soft); font-size:.78rem;}
  .lineItem .amt{font-family:var(--font-mono); white-space:nowrap;}

  .totalsRow{display:flex; justify-content:space-between; font-size:.88rem; padding:4px 0; color:var(--ink-soft);}
  .totalsRow.grand{color:var(--ink); font-weight:700; font-size:1.02rem; border-top:1px dashed var(--line); margin-top:6px; padding-top:10px;}
  .totalsRow .amt{font-family:var(--font-mono);}

  .recentRow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.86rem;}
  .recentRow:last-child{border-bottom:none;}
  .recentRow .meta{color:var(--ink-soft); font-size:.76rem;}

  nav.bottomnav{
    position:sticky; bottom:0; z-index:20; background:var(--paper);
    border-top:1px solid var(--line); display:flex;
  }
  nav.bottomnav button{
    flex:1; background:none; border:none; padding:10px 4px 12px; font-family:var(--font-ui);
    font-size:.68rem; line-height:1.2; font-weight:600; color:var(--ink-soft); cursor:pointer; border-top:2px solid transparent;
  }
  nav.bottomnav button.active{color:var(--indigo); border-top:2px solid var(--amber);}

  .invoiceHead{text-align:left; margin-bottom:10px;}
  .invoiceHead .bn{font-family:var(--font-display); font-size:1.3rem; font-weight:700;}
  .invoiceHead .tg{font-size:.76rem; color:var(--ink-soft); margin-top:2px;}
  .invNo{font-family:var(--font-display); font-size:1.5rem; font-weight:700; margin:14px 0 2px;}
  .invDate{color:var(--ink-soft); font-size:.82rem; margin-bottom:14px;}
  .kepada{font-size:.72rem; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:2px;}
  .kepadaName{font-size:.98rem; font-weight:600; margin-bottom:14px;}

  .invoiceRowHeader{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--white); border:1px solid var(--line); border-radius:12px; cursor:pointer; margin-bottom:10px;}
  .invoiceRowHeader .l1{font-weight:600; font-size:.92rem;}
  .invoiceRowHeader .l2{font-size:.76rem; color:var(--ink-soft); margin-top:2px;}
  .invoiceRowHeader .r{text-align:right;}
  .invoiceRowHeader .amt{font-family:var(--font-mono); font-weight:600;}

  table.dirTable{width:100%; border-collapse:collapse; font-size:.85rem;}
  table.dirTable th{text-align:left; font-size:.72rem; color:var(--ink-soft); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line);}
  table.dirTable td{padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.dirTable tr:last-child td{border-bottom:none;}

  .waPreview{background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:12px; font-family:var(--font-mono); font-size:.78rem; white-space:pre-wrap; margin-top:8px; line-height:1.5;}
  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:var(--white);
    padding:9px 16px; border-radius:999px; font-size:.82rem; z-index:80; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .segTitle{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .segTitle h2{margin:0;}
  a.linklike{color:var(--indigo-2); font-size:.8rem; font-weight:600; text-decoration:none; cursor:pointer;}
  .placeholders{font-size:.74rem; color:var(--ink-soft); margin:4px 0 12px; line-height:1.6;}
  .placeholders code{background:var(--paper); border-radius:4px; padding:1px 5px; font-family:var(--font-mono);}
  .loadingScreen{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--ink-soft); font-size:.9rem;}
  .newRow{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:8px;}
</style>
</head>

<div id="shell">
  <div id="gate" class="loadingScreen" style="display:none; flex-direction:column; gap:14px; padding:0 24px;">
    <div style="font-family:var(--font-display); font-size:1.3rem; font-weight:700; color:var(--ink);">Panel Admin</div>
    <div style="font-size:.85rem; color:var(--ink-soft); text-align:center;">Masukkan password untuk melanjutkan.</div>
    <input type="password" id="gatePass" placeholder="Password" style="max-width:280px; width:100%;" onkeydown="if(event.key==='Enter')tryGate()">

/* ---------- live sync + safe merge-on-write ----------
   Dulu SEMUA record satu koleksi (semua order, semua invoice, dst) disimpan
   numpuk jadi SATU dokumen Firestore, field {items:[...]}. Firestore keras
   batasi satu dokumen maksimal 1MB. Setelah berbulan-bulan jalan, dokumen
   orders/invoices itu jadi makin besar dan transaksi simpannya makin sering
   gagal (atau gampang bentrok kalau ada 2 sesi aktif bersamaan) - itu sumber
   "Gagal menyimpan, coba lagi" yang makin sering muncul, dan kenapa
   pembayaran yang sudah dicatat bisa hilang lagi setelah login ulang: lokal
   kelihatan tersimpan, tapi transaksi ke Firestore-nya gagal diam-diam.

   Sekarang: tiap RECORD (per order, per invoice, per produk, per pelanggan)
   adalah dokumen Firestore sendiri-sendiri di dalam subcollection, bukan
   nimbun jadi satu dokumen raksasa. Nggak ada lagi batas ukuran yang bisa
   kena, dan nyimpen satu record nggak perlu baca+tulis ulang SEMUA record
   lain, jadi juga nggak gampang bentrok antar sesi. */
function diffById(oldList, newList){
  const oldMap = new Map((oldList||[]).map(x=>[x.id,x]));
  const newMap = new Map((newList||[]).map(x=>[x.id,x]));
  const upserts = [];
  newMap.forEach((v,id)=>{
    const prev = oldMap.get(id);
    if(!prev || JSON.stringify(prev)!==JSON.stringify(v)) upserts.push(v);
  });
  const deletes = [];
  oldMap.forEach((v,id)=>{ if(!newMap.has(id)) deletes.push(id); });
  return {upserts, deletes};
}
function cloneList(list){ return (list||[]).map(x=>JSON.parse(JSON.stringify(x))); }
function dataColl(listKey){ return db.collection(COLLECTION).doc('data').collection(listKey); }
async function mergeSave(id, listKey){
  const localList = state[listKey];
  const baseline = (state._synced && state._synced[listKey]) || [];
  const {upserts, deletes} = diffById(baseline, localList);
  if(!upserts.length && !deletes.length){ state._synced[listKey] = cloneList(localList); return; }
  try{
    const collRef = dataColl(listKey);
    const ops = upserts.map(it=>({type:'set', it})).concat(deletes.map(delId=>({type:'delete', delId})));
    for(let i=0; i<ops.length; i+=450){
      const batch = db.batch();
      ops.slice(i, i+450).forEach(op=>{
        if(op.type==='set') batch.set(collRef.doc(String(op.it.id)), op.it);
        else batch.delete(collRef.doc(String(op.delId)));
      });
      await batch.commit();
    }
    // Each record is its own document now, so a successful write can't be
    // silently clobbered by someone else's stale copy of a shared doc -
    // safe to just adopt the local state as the new baseline.
    state._synced[listKey] = cloneList(localList);
    render();
  }catch(e){
    console.error('mergeSave gagal', listKey, e);
    toast('Gagal menyimpan'+(e&&e.message?(': '+e.message):', coba lagi'));
  }
}
async function getLegacyItems(id){
  try{
    const legacyDoc = await db.collection(COLLECTION).doc(id).get();
    return (legacyDoc.exists && Array.isArray(legacyDoc.data().items)) ? legacyDoc.data().items : [];
  }catch(e){ console.error('Baca data lama gagal untuk', id, e); return []; }
}
async function migrateLegacyDoc(id, legacyItems){
  // One-time migration from the old single-document-with-items-array shape.
  // Safe to run from multiple tabs/devices: skips if the subcollection
  // already has data, so it only ever actually migrates once.
  // IMPORTANT: this never deletes/touches the old document — only reads it —
  // so a failed migration can never be the cause of actually losing data.
  if(!legacyItems.length) return true;
  try{
    const collRef = dataColl(id);
    const existing = await collRef.limit(1).get();
    if(!existing.empty) return true;
    for(let i=0; i<legacyItems.length; i+=450){
      const batch = db.batch();
      legacyItems.slice(i, i+450).forEach(it=>{ if(it && it.id) batch.set(collRef.doc(String(it.id)), it); });
      await batch.commit();
    }
    return true;
  }catch(e){
    console.error('Migrasi data lama gagal untuk', id, '— kemungkinan besar Firestore Security Rules belum izinkan path baru.', e);
    return false;
  }
}
async function loadAll(){
  if(firebaseNotConfigured()){
    document.getElementById('loading').innerHTML =
      '<div style="max-width:320px; text-align:center; line-height:1.6; padding:0 20px;">'+
      '<strong>Setup belum selesai</strong><br>Buka file <code>index.html</code>, cari '+
      '<code>firebaseConfig</code> di dekat awal script, dan tempel config Firebase project kamu di sana. '+
      'Lihat instruksi setup yang menyertai file ini untuk langkah lengkapnya.</div>';
    return;
  }
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){
    document.getElementById('loading').textContent = 'Gagal konek ke Firebase: '+e.message;
    return;
  }
  document.getElementById('loading').style.display='flex';
  document.getElementById('app').style.display='none';
  state._synced = state._synced || {};
  const ids = ['books','customers','orders','invoices'];
  const pending = new Set(ids.concat(['settings']));
  let initialized = false;
  function onFirstReady(){
    if(initialized) return;
    initialized = true;
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    render();
  }
  function markReady(id){
    if(pending.has(id)){ pending.delete(id); if(pending.size===0) onFirstReady(); }
  }
  ids.forEach(async id=>{
    const legacyItems = await getLegacyItems(id);
    const migratedOk = await migrateLegacyDoc(id, legacyItems);
    dataColl(id).onSnapshot(snap=>{
      let items = snap.docs.map(d=>d.data());
      if(!items.length && legacyItems.length && !migratedOk){
        // Migration couldn't write to the new location (almost always a
        // Firestore Security Rules issue blocking the new path) - fall back
        // to showing the untouched old data instead of an empty screen,
        // and flag it loudly so it's never mistaken for data loss.
        items = legacyItems;
        state._migrationBroken = state._migrationBroken || {};
        state._migrationBroken[id] = true;
      } else if(state._migrationBroken){
        delete state._migrationBroken[id];
      }
      state[id] = items;
      state._synced[id] = cloneList(items);
      markReady(id);
      if(initialized) render();
    }, ()=>{ markReady(id); });
  });
  db.collection(COLLECTION).doc('settings').onSnapshot(doc=>{
    state.settings = Object.assign({}, DEFAULT_SETTINGS, (doc.exists && doc.data())||{});
    markReady('settings');
    if(initialized) render();
  }, ()=>{ markReady('settings'); });
}
async function persistSettingsDoc(){
  try{ await db.collection(COLLECTION).doc('settings').set(state.settings); }
  catch(e){ toast('Gagal menyimpan, coba lagi'); }
}

function importLiveText(){
  const raw = document.getElementById('importLiveArea').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let count=0, skipped=0;
  lines.forEach(line=>{
    const p = line.split('|').map(s=>s.trim());
    if(p.length<4){ skipped++; return; }
    const [name, phone, bookName, qtyStr, chanStr, priceStr] = p;
    const qty = Math.max(1, Math.round(Number(qtyStr))||0);
    if(!name || !bookName || !qty){ skipped++; return; }
    const channel = (chanStr||'live').toLowerCase().indexOf('po')===0 ? 'po' : 'live';
    let cust = null;
    const phoneDigits = canonPhone(phone);
    if(phoneDigits) cust = state.customers.find(c=>canonPhone(c.phone)===phoneDigits);
    if(!cust) cust = state.customers.find(c=>c.name.toLowerCase()===name.toLowerCase());
    if(!cust){ cust = {id:uid('c'), name, phone:phone||''}; state.customers.push(cust); }
    let book = state.books.find(b=>b.name.toLowerCase()===bookName.toLowerCase());
    if(!book){
      const price = Number((priceStr||'').replace(/[^\d]/g,''));
      if(!price){ skipped++; return; }
      book = {id:uid('b'), name:bookName, price, stock:0, type:channel==='po'?'po':'ready', category:'buku', visible:false};
      state.books.push(book);
    }
    state.orders.push({id:uid('o'), bookId:book.id, customerId:cust.id, qty, price:book.price, ts:Date.now(), invoiceId:null, channel, source:'admin'});
    count++;
  });
  if(count){ saveCustomers(); saveBooks(); saveOrders(); toast(count+' pesanan diimpor'+(skipped?(', '+skipped+' baris dilewati'):'')); render(); }
  else toast('Tidak ada baris valid — cek formatnya');
}

function addLiveOrder(){
  let book = state.liveBook;
  let isNewBook = false;
  if(!book){
    const name = state.liveBookQuery.trim();
    if(!name){ toast('Pilih atau ketik judul buku dulu'); return; }
    const priceEl = document.getElementById('liveNewBookPrice');
    const price = priceEl ? Number(priceEl.value) : 0;
    if(!price){ toast('Isi harga untuk buku baru'); return; }
    const format = readFormatValue('liveNewBookFormat', 'liveNewBookFormatOther');
    const supplierCode = (document.getElementById('liveNewBookSupplier')||{}).value?.trim() || '';
    const kargo = (document.getElementById('liveNewBookKargo')||{}).value?.trim() || '';
    const eta = (document.getElementById('liveNewBookEta')||{}).value?.trim() || '';
    const poStatusEl = document.getElementById('liveNewBookPoStatus');
    const type = state.liveChannel==='po' ? 'po' : 'ready';
    const poStatus = type==='po' ? (poStatusEl?poStatusEl.value:'open') : undefined;
    book = {id:uid('b'), name, price, stock:0, type, poStatus, format, supplierCode, kargo, eta, category:'buku', visible:false};
    state.books.push(book);
    isNewBook = true;
  }
  let cust = state.liveCustomer;
  if(!cust){
    const name = state.liveCustomerQuery.trim();
    if(!name){ toast('Pilih atau ketik nama pelanggan dulu'); return; }
    const phoneEl = document.getElementById('liveNewCustPhone');
    const phone = phoneEl ? phoneEl.value.trim() : '';
    cust = {id:uid('c'), name, phone};
    state.customers.push(cust); saveCustomers();
  }
  const qty = Math.max(1, Number(document.getElementById('liveQty').value)||1);
  let stockWarn = false;
  if(book.type!=='po'){
    const prevStock = book.stock||0;
    book.stock = prevStock - qty;
    stockWarn = book.stock<0;
  }
  // IMPORTANT: a brand-new book must always be saved, regardless of type.
  // The old code only called saveBooks() inside the stock-adjustment branch
  // above, which PO-type books skip entirely — so a newly-typed PO book
  // never got persisted at all. It displayed fine for the rest of the
  // session (still in local state), but after logout/refresh it was gone
  // from Firestore while the order referencing its id still pointed at it,
  // showing up as "?" since the book could no longer be found.
  if(isNewBook || book.type!=='po') saveBooks();
  const discountType = document.getElementById('liveDiscType').value;
  const discountValue = Math.max(0, Number(document.getElementById('liveDiscVal').value)||0);
  const newOrder = {id:uid('o'), bookId:book.id, customerId:cust.id, qty, price:book.price, ts:Date.now(), invoiceId:null, channel:state.liveChannel, source:'admin', discountType, discountValue};
  recomputeDiscount(newOrder);
  state.orders.push(newOrder);
  saveOrders();
  state.liveBook=null; state.liveCustomer=null; state.liveBookQuery=''; state.liveCustomerQuery='';
  toast(stockWarn ? 'Pesanan ditambahkan — stok "'+book.name+'" jadi minus, cek lagi di tab Produk & Pelanggan' : 'Pesanan ditambahkan');
  render();
}
function deleteOrder(id){
  const o = state.orders.find(x=>x.id===id);
  if(o){ const b=bookById(o.bookId); if(b && b.type!=='po'){ b.stock=(b.stock||0)+o.qty; saveBooks(); } }
  state.orders = state.orders.filter(o=>o.id!==id);
  saveOrders(); render();
}

function filteredSortedBooks(){
  const q = state.bookSearch.toLowerCase();
  const catFilter = state.catFilter || 'all';
  const typeFilter = state.bookFilterType || 'all';
  const visFilter = state.bookFilterVisible || 'all';
  const poFilter = state.bookFilterPo || 'all';
  const stockFilter = state.bookFilterStock || 'all';
  const kargoFilter = state.bookFilterKargo || 'all';
  const supplierFilter = state.bookFilterSupplier || 'all';
  const sortMode = state.bookSort || 'name_asc';
  let indexed = state.books.map((b,idx)=>({b,idx}))
    .filter(({b})=>b.name.toLowerCase().includes(q))
    .filter(({b})=> catFilter==='all' ? true : (catFilter==='mainan' ? b.category==='mainan' : b.category!=='mainan'))
    .filter(({b})=> typeFilter==='all' ? true : b.type===typeFilter)
    .filter(({b})=> visFilter==='all' ? true : (visFilter==='visible' ? !!b.visible : !b.visible))
    .filter(({b})=> poFilter==='all' ? true : (b.type==='po' && (b.poStatus||'open')===poFilter))
    .filter(({b})=> stockFilter==='all' ? true : (stockFilter==='out' ? !((b.stock||0)>0) : (b.stock||0)>0))
    .filter(({b})=> kargoFilter==='all' ? true : (b.kargo||'').trim()===kargoFilter)
    .filter(({b})=> supplierFilter==='all' ? true : (b.supplierCode||'').trim()===supplierFilter);
  const sorters = {
    name_asc:(x,y)=>x.b.name.localeCompare(y.b.name),
    name_desc:(x,y)=>y.b.name.localeCompare(x.b.name),
    price_desc:(x,y)=>(y.b.price||0)-(x.b.price||0),
    price_asc:(x,y)=>(x.b.price||0)-(y.b.price||0),
    stock_desc:(x,y)=>(y.b.stock||0)-(x.b.stock||0),
    stock_asc:(x,y)=>(x.b.stock||0)-(y.b.stock||0),
    newest:(x,y)=>y.idx-x.idx,
    oldest:(x,y)=>x.idx-y.idx
  };
  indexed.sort(sorters[sortMode]||sorters.name_asc);
  return indexed.map(x=>x.b);
}

const LOOKUP_TYPE_LABEL = {book:'Buku', supplier:'Supplier', kargo:'Kargo', customer:'Nama pelanggan', invoice:'Invoice'};
function lookupOptionsFor(type){
  if(type==='book') return state.books.map(b=>({value:b.id, label:b.name})).sort((a,b)=>a.label.localeCompare(b.label));
  if(type==='supplier') return [...new Set(state.books.map(b=>(b.supplierCode||'').trim()).filter(Boolean))].sort().map(s=>({value:s, label:s}));
  if(type==='customer') return state.customers.map(c=>({value:c.id, label:c.name})).sort((a,b)=>a.label.localeCompare(b.label));
  if(type==='invoice') return state.invoices.slice().sort((a,b)=>b.createdAt-a.createdAt).map(inv=>{ const c=custById(inv.customerId); return {value:inv.id, label:inv.no+(c?' — '+c.name:'')}; });
  return [...new Set(state.books.map(b=>(b.kargo||'').trim()).filter(Boolean))].sort().map(k=>({value:k, label:k}));
}
function lookupMatchesFor(type, value){
  if(!value) return [];
  return state.orders.filter(o=>{
    if(type==='customer') return o.customerId===value;
    if(type==='invoice') return o.invoiceId===value;
    const b = bookById(o.bookId); if(!b) return false;
    if(type==='book') return b.id===value;
    if(type==='supplier') return (b.supplierCode||'').trim()===value;
    return (b.kargo||'').trim()===value;
  });
}
function setOrderLookup(prefix, type, value){
  const typeKey = prefix+'LookupType', valKey = prefix+'LookupValue';
  if(type!==undefined) state[typeKey] = type;
  if(value!==undefined) state[valKey] = value;
  else if(type!==undefined) state[valKey] = '';
  render();
}
function setLookupSort(prefix, v){ state[prefix+'LookupSort'] = v; render(); }
function renderOrderLookup(prefix, types){
  const typeKey = prefix+'LookupType', valKey = prefix+'LookupValue', sortKey = prefix+'LookupSort';
  let type = state[typeKey] || types[0];
  if(!types.includes(type)){ type = types[0]; state[typeKey] = type; }
  const value = state[valKey] || '';
  const options = lookupOptionsFor(type);
  let matches = lookupMatchesFor(type, value);
  const sortMode = state[sortKey] || 'newest';
  if(value){
    if(sortMode==='newest') matches.sort((a,b)=>b.ts-a.ts);
    else if(sortMode==='oldest') matches.sort((a,b)=>a.ts-b.ts);
    else if(sortMode==='name'){ matches.sort((a,b)=>{ const ca=custById(a.customerId), cb=custById(b.customerId); return (ca?ca.name:'').localeCompare(cb?cb.name:''); }); }
    else if(sortMode==='amount_desc') matches.sort((a,b)=>lineTotal(b)-lineTotal(a));
  }

  const totalSales = matches.reduce((s,o)=>s+lineTotal(o),0);
  const totalModal = matches.reduce((s,o)=>{ const b=bookById(o.bookId); return s+o.qty*(b?(b.modal||0):0); },0);
  const totalProfit = totalSales - totalModal;
  const hasAnyModal = matches.some(o=>{ const b=bookById(o.bookId); return b&&b.modal; });

  return `<div class="card">
    <div class="grid2">
      <div><label class="field">Lihat berdasarkan</label>
        <select onchange="setOrderLookup('${prefix}', this.value)">
          ${types.map(t=>`<option value="${t}" ${type===t?'selected':''}>${esc(LOOKUP_TYPE_LABEL[t]||t)}</option>`).join('')}
        </select></div>
      <div><label class="field">Pilih</label>
        <select onchange="setOrderLookup('${prefix}', undefined, this.value)">
          <option value="">(pilih)</option>
          ${options.map(o=>`<option value="${esc(o.value)}" ${value===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
        </select></div>
    </div>
    ${value? `<div style="margin-top:8px;"><label class="field">Urutkan</label>
      <select onchange="setLookupSort('${prefix}', this.value)">
        <option value="newest" ${sortMode==='newest'?'selected':''}>Terbaru dulu</option>
        <option value="oldest" ${sortMode==='oldest'?'selected':''}>Terlama dulu</option>
        <option value="name" ${sortMode==='name'?'selected':''}>Nama pelanggan A-Z</option>
        <option value="amount_desc" ${sortMode==='amount_desc'?'selected':''}>Nilai tertinggi</option>
      </select></div>`:''}
    ${!value? `<div class="hint">Pilih salah satu dulu buat lihat siapa aja yang pesan.</div>` :
      (!matches.length? `<div class="empty">Belum ada yang pesan.</div>` :
      `<div class="totalsRow grand" style="margin-top:10px;"><span>Nilai Penjualan</span><span class="amt">${fmtR(totalSales)}</span></div>
      ${hasAnyModal? `<div class="totalsRow"><span>Modal</span><span class="amt">${fmtR(totalModal)}</span></div>
      <div class="totalsRow"><span>Untung</span><span class="amt" style="color:var(--sage);">${fmtR(totalProfit)}</span></div>`:''}
      ${matches.map(o=>{ const c=custById(o.customerId); const b=bookById(o.bookId); const inv=o.invoiceId?state.invoices.find(i=>i.id===o.invoiceId):null;
        let statusText;
        if(inv && inv.closed) statusText = inv.no+' — closing invoice';
        else if(inv) statusText = inv.no+' ('+statusLabel(invoiceTotals(inv).status)+')';
        else statusText = 'pending, belum diinvoice';
        return `<div class="lineItem"><div class="name">${esc(c?c.name:'?')} — ${esc(b?b.name:'?')} × ${o.qty}
            <div class="sub">${new Date(o.ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})} · ${statusText}</div>
          </div><div class="amt">${fmtR(lineTotal(o))}</div></div>`;
      }).join('')}`)}
  </div>`;
}

function saveEditBook(id){
  const b=bookById(id); if(!b) return;
  const newPrice = Number(document.getElementById('editBookPrice_'+id).value) || b.price;
  const priceChanged = newPrice !== b.price;
  b.name = document.getElementById('editBookName_'+id).value.trim() || b.name;
  b.price = newPrice;
  b.stock = Math.max(0, Math.round(Number(document.getElementById('editBookStock_'+id).value))||0);
  b.type = document.getElementById('editBookType_'+id).value;
  b.poStatus = b.type==='po' ? document.getElementById('editBookPoStatus_'+id).value : undefined;
  b.kargo = document.getElementById('editBookKargo_'+id).value.trim();
  b.eta = document.getElementById('editBookEta_'+id).value.trim();
  b.format = readFormatValue('editBookFormat_'+id, 'editBookFormatOther_'+id);
  b.category = document.getElementById('editBookCategory_'+id).value;
  b.supplierCode = document.getElementById('editBookSupplier_'+id).value.trim();
  b.dpPercent = Number(document.getElementById('editBookDpPercent_'+id).value)||100;
  b.modal = Number(document.getElementById('editBookModal_'+id).value)||0;
  b.coverUrl = document.getElementById('editBookCover_'+id).value.trim();
  b.previewUrl = document.getElementById('editBookPreview_'+id).value.trim();
  b.visible = document.getElementById('editBookVisible_'+id).checked;
  let updatedOrders = 0;
  if(priceChanged){
    state.orders.forEach(o=>{ if(o.bookId===id && !o.invoiceId){ o.price = newPrice; recomputeDiscount(o); updatedOrders++; } });
    if(updatedOrders) saveOrders();
  }
  saveBooks(); state.editBookId=null;
  toast(updatedOrders? 'Produk disimpan, '+updatedOrders+' pesanan pending ikut diupdate' : 'Produk disimpan');
  render();
}
function updateBookStock(id, val){
  const b=bookById(id); if(!b) return;
  b.stock = Math.max(0, Math.round(Number(val))||0);
  saveBooks();
}

function importBooksText(){
  const raw=document.getElementById('importBooksArea').value;
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let count=0;
  lines.forEach(line=>{
    let name,price,stock,type='ready',kargo='',eta='',previewUrl='',category='buku',supplierCode='',format='',poStatus,dpPercent;
    if(line.includes('|')){
      const p=line.split('|').map(s=>s.trim());
      name=p[0]||''; price=Number((p[1]||'').replace(/[^\d]/g,''));
      stock=p[2]? Math.max(0, Math.round(Number(p[2].replace(/[^\d]/g,''))))||0 : 0;
      type=(p[3]||'ready').toLowerCase().indexOf('po')===0?'po':'ready';
      kargo=p[4]||''; eta=p[5]||''; previewUrl=p[6]||'';
      category=(p[7]||'buku').toLowerCase().indexOf('main')===0?'mainan':'buku';
      supplierCode=p[8]||'';
      format=p[9]||'';
      if(type==='po'){
        const psRaw=(p[10]||'open').toLowerCase();
        poStatus = psRaw.indexOf('closed')===0?'closed':(psRaw.indexOf('hold')===0?'hold':'open');
      }
      const dpRaw=Number((p[11]||'').replace(/[^\d]/g,''));
      if(dpRaw===25||dpRaw===50||dpRaw===100) dpPercent=dpRaw;
    } else {
      const parts=line.split(',');
      if(parts.length<2) return;
      name=parts[0].trim();
      price=Number(parts[1].replace(/[^\d]/g,''));
      stock=parts[2]? Math.max(0, Math.round(Number(parts[2].replace(/[^\d]/g,''))))||0 : 0;
    }
    if(!name||!price) return;
    if(state.books.some(b=>b.name.toLowerCase()===name.toLowerCase())) return;
    state.books.push({id:uid('b'), name, price, stock, type, poStatus, kargo, eta, previewUrl, category, supplierCode, format, dpPercent, visible:false, arrived:false}); count++;
  });
  if(count){ saveBooks(); toast(count+' produk diimpor (belum tampil di katalog)'); render(); } else toast('Tidak ada baris valid');
}

function importCustText(){
  const raw=document.getElementById('importCustArea').value;
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added=0, updated=0;
  lines.forEach(line=>{
    let name,phone,shipName,shipAddress;
    if(line.includes('|')){
      const p=line.split('|').map(s=>s.trim());
      name=p[0]||''; phone=p[1]||''; shipName=p[2]||''; shipAddress=p[3]||'';
    } else {
      const p=line.split(',');
      name=(p[0]||'').trim(); phone=(p.slice(1).join(',')||'').trim(); shipName=''; shipAddress='';
    }
    if(!name) return;
    const phoneDigits = canonPhone(phone);
    let cust = phoneDigits ? state.customers.find(c=>canonPhone(c.phone)===phoneDigits) : null;
    if(!cust && !phoneDigits) cust = state.customers.find(c=>c.name.toLowerCase()===name.toLowerCase() && !canonPhone(c.phone));
    if(cust){
      cust.name = name || cust.name;
      if(phone) cust.phone = phone;
      if(shipName) cust.shipName = shipName;
      if(shipAddress) cust.shipAddress = shipAddress;
      updated++;
    } else {
      state.customers.push({id:uid('c'), name, phone, shipName, shipAddress});
      added++;
    }
  });
  if(added||updated){ saveCustomers(); toast(added+' pelanggan baru, '+updated+' diupdate'); render(); }
  else toast('Tidak ada baris valid');
}

        return `<div class="btn-row"><button class="btn btn-ghost" style="flex:1; justify-content:space-between; display:flex;" onclick="selectKargoGroup('${cid}','${esc(k)}')"><span>${k? esc(k) : 'Tanpa kargo'}</span><span class="hint" style="margin:0;">${cnt} item</span></button></div>`;
      }).join('')}
    </div>`;
  }
  const items = pendingItemsFor(cid).filter(o=>kargoKeyOf(o)===state.invoiceGenKargo);
  const selected = items.filter(o=>state.invoiceGenSelected[o.id]);
  const breakdown = {};
  let defaultMinDp = 0;
  selected.forEach(o=>{
    const b = bookById(o.bookId);
    const pct = dpPct(b);
    const lt = lineTotal(o);
    const dpVal = Math.round(lt*pct/100);
    defaultMinDp += dpVal;
    if(!breakdown[pct]) breakdown[pct] = {base:0, dp:0};
    breakdown[pct].base += lt;
    breakdown[pct].dp += dpVal;
  });
  const pcts = Object.keys(breakdown).map(Number).sort((a,b)=>a-b);
  const selectedSubtotal = selected.reduce((s,o)=>s+lineTotal(o),0);
  const cust = custById(cid);
  const custFloor = (cust && cust.minDpPercent) ? Math.round(selectedSubtotal*cust.minDpPercent/100) : 0;
  const effectiveMinDp = Math.max(defaultMinDp, custFloor);
  return `<div class="newRow">
    <div class="hint" style="margin-bottom:6px;">Kargo: <strong>${state.invoiceGenKargo? esc(state.invoiceGenKargo) : 'Tanpa kargo'}</strong>${keys.length>1?` · <a class="linklike" onclick="state.invoiceGenKargo=null; state.invoiceGenSelected={}; render();">ganti kargo</a>`:''}</div>
    <div class="hint" style="margin-bottom:6px; font-weight:600; color:var(--ink);">Pilih item yang mau diinvoice sekarang:</div>
    ${items.map(o=>{ const b=bookById(o.bookId); const ps=poStatusOf(b); const checked=!!state.invoiceGenSelected[o.id];
      return `<label style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer;">
        <input type="checkbox" style="width:auto;" ${checked?'checked':''} onchange="toggleGenSelect('${o.id}')">
        <span style="flex:1; font-size:.88rem;">${esc(b?b.name:'?')} × ${o.qty}${b&&b.kargo?` <span class="hint" style="margin:0;">(${esc(b.kargo)})</span>`:''}</span>
        ${ps? `<span class="pill ${poStatusPillClass(ps)}" style="font-size:.64rem;">${poStatusLabel(ps)}</span>`:''}
        <span class="amt" style="font-family:var(--font-mono); font-size:.82rem;">${fmtR(lineTotal(o))}</span>
      </label>`;
    }).join('')}
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-ghost btn-sm" onclick="setGenSelectAll('${cid}', true)">Pilih semua</button>
      <button class="btn btn-ghost btn-sm" onclick="setGenSelectAll('${cid}', false)">Kosongkan</button>
    </div>
    <div class="totalsRow grand" style="margin-top:8px;"><span>Subtotal terpilih</span><span class="amt">${fmtR(selectedSubtotal)}</span></div>

    <div class="grid2" style="margin-top:10px;">
      <div><label class="field">Biaya packing</label><input type="text" id="genPacking" value="0" inputmode="numeric"></div>
      <div><label class="field">Ongkir</label><input type="text" id="genShipping" value="0" inputmode="numeric"></div>
    </div>
    <div class="grid2">
      <div><label class="field">Diskon</label><input type="text" id="genDiscount" value="0" inputmode="numeric"></div>
      <div><label class="field">Min. DP</label><input type="text" id="genMinDp" value="${effectiveMinDp}" inputmode="numeric"></div>
    </div>
    ${cust && cust.minDpPercent? `<div class="hint" style="margin-bottom:4px;">Pelanggan ini punya minimum DP wajib ${cust.minDpPercent}% (${fmtR(custFloor)})${custFloor>defaultMinDp? ' — dipakai karena lebih tinggi dari perhitungan per produk.' : ' — sudah terpenuhi dari perhitungan per produk.'}</div>`:''}
    ${pcts.length? `<div class="hint" style="margin-bottom:4px;">Min. DP dihitung otomatis dari DP% tiap produk terpilih:</div>
      ${pcts.map(p=>`<div class="totalsRow" style="font-size:.8rem;"><span>DP ${p}% dari ${fmtR(breakdown[p].base)}</span><span class="amt">${fmtR(breakdown[p].dp)}</span></div>`).join('')}
      <div class="hint" style="margin-top:4px;">Bisa diubah manual kalau ada kesepakatan lain.</div>`:''}
    <div class="hint" style="margin-bottom:8px;">Packing/ongkir belum tentu final? Isi 0 dulu, nanti bisa diedit lagi lewat "Edit packing/ongkir/diskon" pas barang sudah ready to ship.</div>
    <div class="btn-row"><button class="btn btn-amber" onclick="generateInvoice('${cid}')" ${selected.length?'':'disabled style="opacity:.5;"'}>Konfirmasi &amp; buat invoice (${selected.length} item)</button></div>
    ${items.length!==selected.length? `<div class="hint">${items.length-selected.length} item lain tetap pending, bisa diinvoice belakangan setelah statusnya closed.</div>`:''}
  </div>`;
}
function generateInvoice(cid){
  const packing = Number(document.getElementById('genPacking').value)||0;
  const shipping = Number(document.getElementById('genShipping').value)||0;
  const discount = Number(document.getElementById('genDiscount').value)||0;
  const minDp = Number(document.getElementById('genMinDp').value)||0;
  const orderIds = pendingItemsFor(cid).filter(o=>kargoKeyOf(o)===state.invoiceGenKargo && state.invoiceGenSelected[o.id]).map(o=>o.id);
  if(!orderIds.length){ toast('Pilih minimal satu item dulu'); return; }
  const year = new Date().getFullYear();
  const seq = state.settings.invoiceSeq;
  const no = `INV-${year}-${String(seq).padStart(4,'0')}`;
  state.settings.invoiceSeq = seq+1; saveSettings();
  const inv = {id:uid('inv'), no, customerId:cid, orderIds, kargo: state.invoiceGenKargo||'', packing, shipping, discount, minDp, paidAmount:0, payments:[], createdAt:Date.now(), paidAt:null};
  state.invoices.push(inv);
  state.orders.forEach(o=>{ if(orderIds.includes(o.id)) o.invoiceId=inv.id; });
  saveInvoices(); saveOrders();
  state.openInvoiceGen=null; state.invoiceGenSelected={}; state.invoiceGenKargo=null; state.tab='invoice'; state.expandedInvoice=inv.id;
  toast('Invoice '+no+' dibuat');
  render();
}
function addCustManual(){
  const name=document.getElementById('newCustName').value.trim();
  const phone=document.getElementById('newCustPhone').value.trim();
  const shipName=document.getElementById('newCustShipName').value.trim();
  const shipAddress=document.getElementById('newCustShipAddr').value.trim();
  const minDpRaw=document.getElementById('newCustMinDp').value.trim();
  const minDpPercent = minDpRaw? Math.max(0, Math.min(100, Number(minDpRaw)||0)) : 0;
  if(!name){ toast('Isi nama pelanggan'); return; }
  state.customers.push({id:uid('c'), name, phone, shipName, shipAddress, minDpPercent});

}
function deleteCust(id){
  if(state.orders.some(o=>o.customerId===id)){ toast('Pelanggan ini punya riwayat pesanan, tidak bisa dihapus'); return; }
  state.customers=state.customers.filter(c=>c.id!==id); saveCustomers(); render();
}

/* ================= INVOICE TAB ================= */
function invStatus(paid, total){ if(paid<=0) return 'belum_bayar'; if(paid>=total) return 'lunas'; return 'dp'; }
function statusLabel(s){ return s==='lunas'?'Lunas':(s==='dp'?'DP':'Belum Bayar'); }
function statusPillClass(s){ return s==='lunas'?'pill-paid':(s==='dp'?'pill-dp':'pill-unpaid'); }
function invoiceTotals(inv){
  const orders = state.orders.filter(o=>o.invoiceId===inv.id);
  const subtotal = orders.reduce((s,o)=>s+o.qty*o.price,0);
  const itemDiscount = orders.reduce((s,o)=>s+(o.discount||0),0);
  const total = subtotal - itemDiscount + (inv.packing||0) + (inv.shipping||0) - (inv.discount||0);
  const paid = inv.paidAmount||0;
  const status = invStatus(paid, total);
  return {orders, subtotal, itemDiscount, total, paid, status};
}
function invMatchesFilter(inv){
  const fs = state.invSupplier || 'all';
  const fk = state.invKargo || 'all';
  if(fs==='all' && fk==='all') return true;
  const orders = state.orders.filter(o=>o.invoiceId===inv.id);
  return orders.some(orderMatchesFilter);
}
function orderMatchesFilter(o){
  const fs = state.invSupplier || 'all';
  const fk = state.invKargo || 'all';
  if(fs==='all' && fk==='all') return true;
  const b = bookById(o.bookId);
  const sup = (b && (b.supplierCode||'').trim()) || '';
  const kar = (b && (b.kargo||'').trim()) || '';
  return (fs==='all' || sup===fs) && (fk==='all' || kar===fk);
}

        <select onchange="setInvFilter('kargo', this.value)">
          <option value="all" ${(state.invKargo||'all')==='all'?'selected':''}>Semua kargo</option>

    <div class="totalsRow" style="margin-top:10px;"><span>Jumlah invoice</span><span class="amt">${list.length}${list.length!==all.length?' dari '+all.length:''}</span></div>
    <div class="totalsRow"><span>Nilai invoice</span><span class="amt">${fmtR(sumTotal)}</span></div>

    <div class="totalsRow grand"><span>Belum terbayar</span><span class="amt" style="color:var(--rust);">${fmtR(sumUnpaid)}</span></div>
    ${hasAnyModal? `<div class="totalsRow" style="margin-top:6px;"><span>Modal</span><span class="amt">${fmtR(sumModal)}</span></div>
    <div class="totalsRow"><span>Estimasi untung</span><span class="amt" style="color:var(--sage);">${fmtR(sumTotal-sumModal)}</span></div>`:''}
    <div class="hint" style="margin-top:6px;">Lunas ${cntLunas} · DP ${cntDp} · Belum bayar ${cntBelum}</div>
    ${(state.invSupplier&&state.invSupplier!=='all')||(state.invKargo&&state.invKargo!=='all') ? `<div class="hint">Angka di atas dihitung dari total penuh invoice yang <em>memuat</em> produk sesuai filter — bukan porsi per produknya saja.</div>`:''}
    ${hasAnyModal? `<div class="hint">Estimasi untung cuma menghitung produk yang sudah kamu isi modalnya — produk lain dianggap modal 0 di angka ini.</div>`:''}
  </div>`;
  const anyClosed = state.invoices.some(inv=>inv.closed);
  if(anyClosed){ html += renderClosingReport(); }
  if(!list.length){ html += `<div class="empty">${all.length? 'Tidak ada invoice yang cocok dengan filter/pencarian.' : 'Belum ada invoice. Buat dari tab Order &gt; Invoicing.'}</div>`; }
  else { html += `<div class="hint" style="margin:6px 0;">${list.length} invoice cocok${list.length>shownInv.length?' · menampilkan '+shownInv.length:''}.</div>`; }
  shownInv.forEach(inv=>{

    html += `<div class="invoiceRowHeader" onclick="toggleInvoice('${inv.id}')">

    </div>`;
    if(state.expandedInvoice===inv.id) html += renderInvoiceDetail(inv, false);
  });
  if(list.length>shownInv.length){
    html += `<div class="btn-row"><button class="btn btn-ghost" style="flex:1;" onclick="state.invPage=(state.invPage||20)+20; render();">Tampilkan lebih (sisa ${list.length-shownInv.length})</button></div>`;
  }
  if(list.length){
    html += `<div class="btn-row">
      <button class="btn btn-ghost" onclick="exportInvoicesXlsx()">Export XLSX</button>
      <button class="btn btn-ghost" onclick="exportInvoicesTxt()">Export TXT</button>
    </div>
    <div class="hint">Export mengikuti filter yang aktif.</div>`;
  }
  html += `<h2 class="sectionTitle">Impor Riwayat Pesanan Lama</h2>
  <div class="card">

    <textarea id="importHistArea" style="min-height:120px;" placeholder="Alifia, 08123456789, Water, 1, 160000, lunas, 2026-08-10&#10;Alifia, 08123456789, Insect, 1, 160000, lunas, 2026-08-10"></textarea>

function setInvFilter(kind, val){
  if(kind==='supplier') state.invSupplier = val;
  else state.invKargo = val;
  state.expandedInvoice=null; state.invPage=20; render();
}
function resetInvFilter(){ state.invSupplier='all'; state.invKargo='all'; state.expandedInvoice=null; state.invPage=20; render(); }
function setInvSearch(v){ state.invSearch=v; state.invPage=20; render(); }
function setInvSort(v){ state.invSort=v; state.invPage=20; render(); }
function invoiceExportRows(){
  const rows=[['No Invoice','Tanggal','Pelanggan','No HP','Alamat','Produk','Supplier','Kargo','Qty','Harga Satuan','Diskon Item','Subtotal Item','Channel','Total Invoice','Sudah Dibayar','Sisa','Status']];
  state.invoices.slice().sort((a,b)=>a.createdAt-b.createdAt).filter(invMatchesFilter).forEach(inv=>{
    const cust = custById(inv.customerId);
    const {orders, total, paid, status} = invoiceTotals(inv);
    const dateStr = new Date(inv.createdAt).toLocaleDateString('id-ID');
    // Prefer the address the customer set specifically for this invoice
    // (lewat "Atur pengiriman" di sisi pelanggan); kalau belum ada, pakai
    // alamat default yang tersimpan di profil pelanggan.
    const address = (inv.shipTo && inv.shipTo.address) || (cust && cust.shipAddress) || '';
    orders.forEach(o=>{
      const b=bookById(o.bookId);
      rows.push([inv.no, dateStr, cust?cust.name:'?', cust?dispPhone(cust.phone):'', address, b?b.name:'?', b?(b.supplierCode||''):'', b?(b.kargo||''):'', o.qty, o.price, o.discount||0, lineTotal(o), o.channel==='po'?'PO':'Live', total, paid, Math.max(0,total-paid), statusLabel(status)]);
    });
  });
  return rows;
}
function exportInvoicesTxt(){
  const rows = invoiceExportRows();
  const text = rows.map(r=>r.join('\t')).join('\n');
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='riwayat-pesanan-bagbigbook.txt'; a.click();
}
function exportInvoicesXlsx(){
  if(typeof XLSX === 'undefined'){ toast('Modul export belum siap, coba lagi sebentar'); return; }
  const rows = invoiceExportRows();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Riwayat Pesanan');
  XLSX.writeFile(wb, 'riwayat-pesanan-bagbigbook.xlsx');
}
function importHistoryText(){
  const raw=document.getElementById('importHistArea').value;
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const groups={};
  let skipped=0;
  lines.forEach(line=>{
    const p=line.split(',').map(s=>s.trim());
    if(p.length<5){ skipped++; return; }
    const [name, phone, bookName, qtyStr, priceStr, statusStr, dateStr] = p;
    const qty=Math.max(1, Math.round(Number(qtyStr))||0);
    const price=Number((priceStr||'').replace(/[^\d]/g,''));
    if(!name || !bookName || !qty || !price){ skipped++; return; }
    const status = (statusStr||'').toLowerCase().indexOf('lunas')===0 ? 'lunas' : 'belum_bayar';
    const dateKey = dateStr || 'no-date';
    const groupKey = name.toLowerCase()+'|'+(phone||'')+'|'+dateKey;
    (groups[groupKey]=groups[groupKey]||{name,phone,dateStr,status,items:[]}).items.push({bookName, qty, price});
  });
  let custCount=0, bookCount=0, invCount=0;
  Object.values(groups).forEach(g=>{
    let cust = state.customers.find(c=>c.name.toLowerCase()===g.name.toLowerCase() && (!g.phone || (c.phone||'')===g.phone));
    if(!cust){ cust={id:uid('c'), name:g.name, phone:g.phone||''}; state.customers.push(cust); custCount++; }
    const orderIds=[];
    g.items.forEach(it=>{
      let book = state.books.find(b=>b.name.toLowerCase()===it.bookName.toLowerCase());
      if(!book){ book={id:uid('b'), name:it.bookName, price:it.price, stock:0, type:'ready'}; state.books.push(book); bookCount++; }
      const ts = g.dateStr ? new Date(g.dateStr).getTime()||Date.now() : Date.now();
      const order={id:uid('o'), bookId:book.id, customerId:cust.id, qty:it.qty, price:it.price, ts, invoiceId:null, channel:'live', source:'admin'};
      state.orders.push(order); orderIds.push(order.id);
    });
    const year = g.dateStr ? new Date(g.dateStr).getFullYear()||new Date().getFullYear() : new Date().getFullYear();
    const seq = state.settings.invoiceSeq; state.settings.invoiceSeq = seq+1;
    const no = `INV-${year}-${String(seq).padStart(4,'0')}`;
    const createdAt = g.dateStr ? (new Date(g.dateStr).getTime()||Date.now()) : Date.now();
    const itemTotal = g.items.reduce((s,it)=>s+it.qty*it.price,0);
    const paidAmount = g.status==='lunas' ? itemTotal : 0;
    const payments = g.status==='lunas' ? [{amount:itemTotal, date:createdAt, note:'Impor riwayat'}] : [];
    const inv={id:uid('inv'), no, customerId:cust.id, orderIds, packing:0, shipping:0, paidAmount, payments, createdAt, paidAt:g.status==='lunas'?createdAt:null};
    state.invoices.push(inv);
    orderIds.forEach(oid=>{ const o=state.orders.find(x=>x.id===oid); if(o) o.invoiceId=inv.id; });
    invCount++;
  });
  if(invCount){ saveCustomers(); saveBooks(); saveOrders(); saveInvoices(); saveSettings(); toast(invCount+' invoice lama diimpor'+(skipped?(', '+skipped+' baris dilewati'):'')); render(); }
  else toast('Tidak ada baris valid untuk diimpor');
}
function toggleInvoice(id){ state.expandedInvoice = state.expandedInvoice===id ? null : id; state.waOpen=null; state.payOpen=null; render(); }
function renderInvoiceDetail(inv, readonly){
  const cust = custById(inv.customerId);
  const {orders, subtotal, itemDiscount, total, paid, status} = invoiceTotals(inv);
  const sisa = Math.max(0, total-paid);
  let html = `<div class="card">
    <div class="invoiceHead">
      <div class="bn">${esc(state.settings.bizName)}</div>
      <div class="tg">${esc(state.settings.tagline)}</div>
    </div>
    <span class="pill ${statusPillClass(status)}">${statusLabel(status)}</span>
    <div class="invNo">${inv.no}</div>
    <div class="invDate">${new Date(inv.createdAt).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>
    <div class="kepada">KEPADA</div>
    <div class="kepadaName">${esc(cust?cust.name:'?')}${cust&&cust.phone?' · '+esc(dispPhone(cust.phone)):''}</div>
    ${orders.map(o=>{ const b=bookById(o.bookId);
      const kargoEta = b&&(b.kargo||b.eta) ? [b.kargo?'Kargo '+esc(b.kargo):'', b.eta?'ETA '+esc(b.eta):''].filter(Boolean).join(' · ') : '';
      return `<div class="lineItem"><div><div class="name">${esc(b?b.name:'?')}</div><div class="sub">${o.qty} × ${fmtR(o.price)}${o.channel==='po'?' · PO':''}${o.discount?' · diskon '+fmtR(o.discount):''}</div>${kargoEta?`<div class="sub">${kargoEta}</div>`:''}</div><div class="amt">${fmtR(lineTotal(o))}</div></div>`;
    }).join('')}
    <div class="totalsRow"><span>Subtotal</span><span class="amt">${fmtR(subtotal)}</span></div>
    ${itemDiscount? `<div class="totalsRow"><span>Diskon per item</span><span class="amt">-${fmtR(itemDiscount)}</span></div>`:''}
    ${inv.discount? `<div class="totalsRow"><span>Diskon tambahan</span><span class="amt">-${fmtR(inv.discount)}</span></div>`:''}
    <div class="totalsRow"><span>Biaya packing</span><span class="amt">${fmtR(inv.packing||0)}</span></div>
    <div class="totalsRow"><span>Ongkir</span><span class="amt">${fmtR(inv.shipping||0)}</span></div>
    <div class="totalsRow grand"><span>Total</span><span class="amt">${fmtR(total)}</span></div>
    ${inv.minDp? `<div class="totalsRow"><span>Min. DP</span><span class="amt">${fmtR(inv.minDp)}</span></div>`:''}
    ${paid>0 ? `<div class="totalsRow"><span>Sudah dibayar</span><span class="amt" style="color:var(--sage);">${fmtR(paid)}</span></div>
    <div class="totalsRow"><span>Sisa</span><span class="amt" style="color:${sisa>0?'var(--rust)':'var(--sage)'};">${fmtR(sisa)}</span></div>`:''}
    ${qrisEligible(total) ? `<div style="text-align:center; margin-top:14px;">
      <div class="hint" style="margin-bottom:6px;">Total di bawah ${fmtR(state.settings.qrisMaxAmount||500000)} — bisa juga bayar pakai QRIS:</div>
      <img src="${QRIS_B64}" style="width:180px; max-width:70%; border-radius:8px; border:1px solid var(--line);">
    </div>`:''}
    ${inv.payments&&inv.payments.length? `<div class="hint" style="margin-top:10px; font-weight:600; color:var(--ink);">Riwayat pembayaran</div>
    ${inv.payments.map(p=>`<div class="totalsRow"><span>${new Date(p.date).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}${p.note?' · '+esc(p.note):''}</span><span class="amt">${fmtR(p.amount)}</span></div>`).join('')}`:''}`;
  if(!readonly){
    html += `<div class="btn-row">
      <button class="btn btn-ghost" onclick="toggleFeeForm('${inv.id}')">Edit packing/ongkir/diskon</button>
    </div>
    ${state.feeOpen===inv.id ? `<div class="newRow">
      <label class="field">Biaya packing</label><input type="text" id="feePacking_${inv.id}" value="${inv.packing||0}" inputmode="numeric">
      <label class="field">Ongkir</label><input type="text" id="feeShipping_${inv.id}" value="${inv.shipping||0}" inputmode="numeric">
      <label class="field">Diskon</label><input type="text" id="feeDiscount_${inv.id}" value="${inv.discount||0}" inputmode="numeric">
      <label class="field">Min. DP</label><input type="text" id="feeMinDp_${inv.id}" value="${inv.minDp||0}" inputmode="numeric">
      <div class="btn-row"><button class="btn btn-primary" onclick="saveFees('${inv.id}')">Simpan</button></div>
    </div>`:''}
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="togglePayForm('${inv.id}')">Catat pembayaran</button>

    </div>

      <label class="field">Jumlah dibayar</label><input type="text" id="payAmount_${inv.id}" placeholder="mis. 100000" inputmode="numeric">
      <label class="field">Tanggal bayar</label><input type="date" id="payDate_${inv.id}" value="${new Date().toISOString().slice(0,10)}">
      <label class="field">Catatan (opsional)</label><input type="text" id="payNote_${inv.id}" placeholder="mis. DP hari ini">
      <div class="btn-row"><button class="btn btn-primary" onclick="addPayment('${inv.id}')">Simpan pembayaran</button></div>
    </div>`:''}
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="downloadInvoiceImage('${inv.id}')">Unduh invoice (gambar)</button>
    </div>
    ${paid>0 ? `<div class="btn-row"><button class="btn btn-ghost" onclick="resetPayment('${inv.id}')">Reset pembayaran</button>
      <button class="btn btn-ghost" onclick="deleteInvoice('${inv.id}')">Hapus invoice</button></div>` 
      : `<div class="btn-row"><button class="btn btn-ghost" onclick="deleteInvoice('${inv.id}')">Hapus invoice</button></div>`}

      <button class="btn btn-amber" onclick="openWa('${inv.id}','awal')">Pesan WA: Invoice</button>
      <button class="btn btn-amber" onclick="openWa('${inv.id}','pelunasan')">Pesan WA: Pelunasan</button>
    </div>
    ${state.waOpen && state.waOpen.id===inv.id ? renderWaPreview(inv) : ''}`;
  }
  html += `</div>`;
  return html;
}
function togglePayForm(id){ state.payOpen = state.payOpen===id ? null : id; render(); }
function toggleFeeForm(id){ state.feeOpen = state.feeOpen===id ? null : id; render(); }
function saveFees(id){
  const inv = state.invoices.find(i=>i.id===id); if(!inv) return;
  inv.packing = Number(document.getElementById('feePacking_'+id).value)||0;
  inv.shipping = Number(document.getElementById('feeShipping_'+id).value)||0;
  inv.discount = Number(document.getElementById('feeDiscount_'+id).value)||0;
  inv.minDp = Number(document.getElementById('feeMinDp_'+id).value)||0;
  saveInvoices(); state.feeOpen=null; toast('Biaya invoice diupdate'); render();
}
function addPayment(id){
  const inv = state.invoices.find(i=>i.id===id); if(!inv) return;
  const amount = Number(document.getElementById('payAmount_'+id).value);
  if(!amount || amount<=0){ toast('Isi jumlah pembayaran'); return; }
  const dateVal = document.getElementById('payDate_'+id).value;
  const date = dateVal ? new Date(dateVal+'T12:00:00').getTime() : Date.now();
  const note = document.getElementById('payNote_'+id).value.trim();
  inv.payments = inv.payments || [];
  inv.payments.push({amount, date, note});
  inv.paidAmount = (inv.paidAmount||0) + amount;
  const {total} = invoiceTotals(inv);
  if(inv.paidAmount>=total) inv.paidAt = date;
  saveInvoices(); state.payOpen=null; toast('Pembayaran dicatat'); render();
}
function markInvoicePaid(id){
  const inv = state.invoices.find(i=>i.id===id); if(!inv) return;
  const {total, paid} = invoiceTotals(inv);
  const sisa = total-paid;
  if(sisa<=0) return;
  inv.payments = inv.payments || [];
  inv.payments.push({amount:sisa, date:Date.now(), note:'Pelunasan'});
  inv.paidAmount = total;
  inv.paidAt = Date.now();
  saveInvoices(); toast('Ditandai lunas'); render();
}
function resetPayment(id){
  const inv = state.invoices.find(i=>i.id===id); if(!inv) return;
  inv.paidAmount = 0; inv.payments = []; inv.paidAt = null;
  saveInvoices(); toast('Pembayaran direset'); render();
}

function deleteInvoice(id){
  state.orders.forEach(o=>{ if(o.invoiceId===id) o.invoiceId=null; });
  state.invoices = state.invoices.filter(i=>i.id!==id);
  saveOrders(); saveInvoices();
  state.expandedInvoice=null; render();
}
function buildWaText(inv, kind){
  const cust = custById(inv.customerId);
  const {orders, total} = invoiceTotals(inv);
  const items = orders.map(o=>{ const b=bookById(o.bookId); return `- ${o.qty} x ${b?b.name:'?'} — ${fmtR(o.qty*o.price)}`; }).join('\n');
  const vars = {
    bizName:state.settings.bizName, nama:cust?cust.name:'',
    items, total:fmtR(total), bank:state.settings.bank, rekening:state.settings.rekening,
    atasnama:state.settings.atasnama, invoiceNo:inv.no
  };
  const tpl = kind==='awal' ? state.settings.waAwal : state.settings.waPelunasan;
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> vars[k]!==undefined ? vars[k] : m);
}
function openWa(id, kind){ state.waOpen = {id, kind}; render(); }
function renderWaPreview(inv){
  const cust = custById(inv.customerId);
  const text = buildWaText(inv, state.waOpen.kind);
  const link = cust && cust.phone ? `https://wa.me/${waPhone(cust.phone)}?text=${encodeURIComponent(text)}` : null;
  return `<div class="waPreview" id="waText">${esc(text)}</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="copyWa()">Salin pesan</button>
      ${link? `<a class="btn btn-primary" href="${link}" target="_blank" rel="noopener">Buka WhatsApp</a>` : `<button class="btn btn-ghost" disabled>Tanpa no. HP</button>`}
    </div>`;
}
function copyWa(){
  const text = document.getElementById('waText').textContent;
  navigator.clipboard.writeText(text).then(()=>toast('Pesan disalin')).catch(()=>toast('Gagal menyalin'));
}

/* ================= PACKING TAB ================= */
function firstPaymentDate(inv){
  if(inv.payments && inv.payments.length) return Math.min(...inv.payments.map(p=>p.date));
  return null;
}
function invoiceItemsReady(inv){
  const orders = state.orders.filter(o=>o.invoiceId===inv.id);
  if(!orders.length) return false;
  return orders.every(o=>{ const b=bookById(o.bookId); return !b || b.type!=='po' || b.arrived; });
}
function packingOkOf(inv, status){ return !!inv.packingPaid || status==='lunas'; }
function shippingOkOf(inv, status){ return !!inv.shippingPaid || status==='lunas'; }
function renderPacking(){
  const active = state.invoices.filter(inv=>!inv.closed && invoiceItemsReady(inv) && (inv.paidAmount||0)>0);
  const rows = active.map(inv=>{
    const cust = custById(inv.customerId);
    const orders = state.orders.filter(o=>o.invoiceId===inv.id);
    const payDate = firstPaymentDate(inv);
    const {status, total} = invoiceTotals(inv);
    return {inv, cust, orders, payDate, status, total};
  }).sort((a,b)=>{
    if(a.payDate===null && b.payDate===null) return 0;
    if(a.payDate===null) return 1;
    if(b.payDate===null) return -1;
    return a.payDate - b.payDate;
  });
  const closedList = state.invoices.filter(inv=>inv.closed).sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));

  let html = `<h2 class="sectionTitle">Urutan Packing</h2>
  <div class="hint" style="margin:-4px 0 12px;">Invoice muncul di sini begitu ada pembayaran masuk &amp; semua itemnya siap dikirim — Ready Stock langsung siap, buku PO baru muncul setelah ditandai "sudah sampai" di tab Produk. Invoice yang belum ada pembayaran sama sekali tidak muncul dulu. Urutannya berdasarkan siapa bayar duluan.</div>`;
  if(!rows.length){
    html += `<div class="empty">Belum ada invoice yang siap dipacking.</div>`;
  }
  rows.forEach((r,i)=>{
    const packingOk = packingOkOf(r.inv, r.status);
    const shippingOk = shippingOkOf(r.inv, r.status);
    const packedOk = r.inv.packed;
    const paidOk = r.status==='lunas';
    const readyToClose = paidOk && packingOk && shippingOk && packedOk;
    const missing = [];
    if(!paidOk) missing.push('pelunasan');
    if(!packingOk) missing.push('packing fee');
    if(!shippingOk) missing.push('ongkir');
    if(!packedOk) missing.push('pengiriman');
    html += `<div class="card">
      <div style="font-weight:600;">${i+1}. ${esc(r.cust?r.cust.name:'?')} <span class="pill" style="background:var(--paper); color:var(--ink-soft); font-size:.68rem;">${r.inv.no}</span></div>
      <div class="hint" style="margin-bottom:8px;">${r.payDate? 'Bayar pertama: '+new Date(r.payDate).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : 'Belum ada pembayaran'} · <span class="pill ${statusPillClass(r.status)}" style="font-size:.66rem;">${statusLabel(r.status)}</span></div>
      ${r.orders.map(o=>{ const b=bookById(o.bookId); return `<div class="lineItem"><div class="name">${esc(b?b.name:'?')} × ${o.qty}${b&&b.type==='po'?' · PO':''}</div></div>`; }).join('')}
      <div class="totalsRow"><span>Biaya packing</span><span class="amt">${fmtR(r.inv.packing||0)}</span></div>
      <div class="totalsRow"><span>Ongkir</span><span class="amt">${fmtR(r.inv.shipping||0)}</span></div>
      <div class="btn-row" style="margin-top:6px;">
        <button class="btn btn-ghost btn-sm" onclick="togglePackFeeForm('${r.inv.id}')">Isi/ubah packing fee &amp; ongkir</button>
      </div>
      ${state.packFeeOpen===r.inv.id? `<div class="newRow">
        <label class="field">Biaya packing</label><input type="text" id="packFeePacking_${r.inv.id}" value="${r.inv.packing||0}" inputmode="numeric">
        <label class="field">Ongkir</label><input type="text" id="packFeeShipping_${r.inv.id}" value="${r.inv.shipping||0}" inputmode="numeric">
        <div class="btn-row"><button class="btn btn-primary" onclick="savePackFees('${r.inv.id}')">Simpan</button></div>
      </div>`:''}
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-sm ${packingOk?'btn-ghost':'btn-amber'}" ${r.status==='lunas'?'disabled style="opacity:.5;"':''} onclick="togglePackFlag('${r.inv.id}','packingPaid')">${packingOk?'✓ Packing fee dibayar':'Packing fee belum'}</button>
        <button class="btn btn-sm ${shippingOk?'btn-ghost':'btn-amber'}" ${r.status==='lunas'?'disabled style="opacity:.5;"':''} onclick="togglePackFlag('${r.inv.id}','shippingPaid')">${shippingOk?'✓ Ongkir dibayar':'Ongkir belum'}</button>
      </div>
      ${r.status==='lunas'? `<div class="hint">Invoice sudah lunas — packing fee &amp; ongkir otomatis dianggap terbayar.</div>`:''}
      <div class="btn-row">
        <button class="btn btn-sm ${packedOk?'btn-ghost':'btn-amber'}" onclick="togglePackFlag('${r.inv.id}','packed')">${packedOk?'✓ Sudah dikirim':'Tandai kirim'}</button>
      </div>
      <div class="btn-row">
        <button class="btn ${readyToClose?'btn-primary':'btn-ghost'}" ${readyToClose?'':'disabled style="opacity:.5;"'} onclick="closeInvoice('${r.inv.id}')">Closing</button>
      </div>
      ${!readyToClose? `<div class="hint">Belum bisa closing — masih menunggu: ${missing.join(', ')}.</div>`:''}
    </div>`;
  });
  if(closedList.length){
    html += `<h2 class="sectionTitle">Riwayat Closing</h2>`;
    closedList.slice(0,30).forEach(inv=>{
      const cust = custById(inv.customerId);
      html += `<div class="recentRow">
        <div><div>${esc(cust?cust.name:'?')} — ${inv.no}</div>
        <div class="meta">Closing: ${inv.closedAt? new Date(inv.closedAt).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : '-'}</div></div>
        <button class="iconbtn" style="color:var(--ink-soft);" onclick="reopenInvoice('${inv.id}')" title="Buka lagi">↺</button>
      </div>`;
    });
  }
  return html;
}
function renderClosingReport(){
  const allClosed = state.invoices.filter(inv=>inv.closed);
  let grossSales=0, itemDiscTotal=0, modalTotal=0, hasAnyModal=false;
  allClosed.forEach(inv=>{
    const {orders} = invoiceTotals(inv);
    orders.forEach(o=>{
      if(!orderMatchesFilter(o)) return;
      grossSales += o.qty*o.price;
      itemDiscTotal += (o.discount||0);
      const b=bookById(o.bookId);
      if(b&&b.modal){ hasAnyModal=true; modalTotal += o.qty*b.modal; }
    });
  });
  let invDiscTotal=0, packingTotal=0, shippingTotal=0;
  allClosed.forEach(inv=>{
    invDiscTotal += (inv.discount||0);
    packingTotal += (inv.packing||0);
    shippingTotal += (inv.shipping||0);
  });
  const netSales = grossSales - itemDiscTotal;
  const grandTotal = netSales + packingTotal + shippingTotal - invDiscTotal;
  const filtered = (state.invSupplier&&state.invSupplier!=='all')||(state.invKargo&&state.invKargo!=='all');
  return `<h2 class="sectionTitle">Laporan Closing</h2>
  <div class="card">
    ${filtered
      ? `<div class="hint" style="margin-bottom:8px;">Dari ${allClosed.length} invoice yang sudah closing. <strong>Total jual buku, diskon per item, modal &amp; untung</strong> dihitung khusus porsi produk sesuai filter. <strong>Diskon tambahan, packing fee, ongkir</strong> tetap dihitung dari semua invoice closing (nggak dipecah per produk, nggak ikut filter).</div>`
      : `<div class="hint" style="margin-bottom:8px;">Dari ${allClosed.length} invoice yang sudah closing.</div>`}
    <div class="totalsRow"><span>Total jual buku (sebelum diskon)</span><span class="amt">${fmtR(grossSales)}</span></div>
    <div class="totalsRow"><span>Diskon per item</span><span class="amt">-${fmtR(itemDiscTotal)}</span></div>
    <div class="totalsRow grand"><span>Total jual buku (setelah diskon)</span><span class="amt">${fmtR(netSales)}</span></div>
    ${hasAnyModal? `<div class="totalsRow" style="margin-top:6px;"><span>Modal</span><span class="amt">${fmtR(modalTotal)}</span></div>
    <div class="totalsRow"><span>Untung (buku, setelah modal)</span><span class="amt" style="color:var(--sage);">${fmtR(netSales-modalTotal)}</span></div>
    <div class="hint">Untung cuma menghitung produk yang sudah diisi modalnya; produk lain dianggap modal 0.</div>`:''}
    <div class="hint" style="margin:10px 0 2px; font-weight:600; color:var(--ink);">Level invoice, semua closing (nggak ikut filter)</div>
    <div class="totalsRow"><span>Diskon tambahan</span><span class="amt">-${fmtR(invDiscTotal)}</span></div>
    <div class="totalsRow"><span>Packing fee</span><span class="amt">${fmtR(packingTotal)}</span></div>
    <div class="totalsRow"><span>Ongkir</span><span class="amt">${fmtR(shippingTotal)}</span></div>
    <div class="totalsRow grand"><span>Total diterima (semua closing)</span><span class="amt">${fmtR(grandTotal)}</span></div>
  </div>`;
}
function togglePackFeeForm(invId){ state.packFeeOpen = state.packFeeOpen===invId ? null : invId; render(); }
function savePackFees(invId){
  const inv = state.invoices.find(i=>i.id===invId); if(!inv) return;
  const before = invoiceTotals(inv);
  const wasLunas = before.status==='lunas';
  inv.packing = Number(document.getElementById('packFeePacking_'+invId).value)||0;
  inv.shipping = Number(document.getElementById('packFeeShipping_'+invId).value)||0;
  let note = 'Packing fee & ongkir diupdate';
  if(wasLunas){
    const after = invoiceTotals(inv);
    const diff = after.total - before.total;
    if(diff>0){
      inv.payments = inv.payments || [];
      inv.payments.push({amount:diff, date:Date.now(), note:'Packing fee/ongkir (otomatis, invoice sudah lunas)'});
      inv.paidAmount = (inv.paidAmount||0) + diff;
      inv.paidAt = Date.now();
      note = 'Packing fee & ongkir diupdate, otomatis tercatat lunas';
    } else if(diff<0){
      inv.paidAmount = Math.min(inv.paidAmount||0, after.total);
    }
  }
  saveInvoices(); state.packFeeOpen=null; toast(note); render();
}
function togglePackFlag(invId, field){
  const inv = state.invoices.find(i=>i.id===invId); if(!inv) return;
  inv[field] = !inv[field];
  saveInvoices(); render();
}
function closeInvoice(invId){
  const inv = state.invoices.find(i=>i.id===invId); if(!inv) return;
  inv.closed = true; inv.closedAt = Date.now();
  saveInvoices(); toast('Invoice '+inv.no+' di-closing'); render();
}
function reopenInvoice(invId){
  const inv = state.invoices.find(i=>i.id===invId); if(!inv) return;
  inv.closed = false; inv.closedAt = null;
  saveInvoices(); toast('Invoice dibuka lagi'); render();
}

  <div class="empty" style="margin-top:16px;">Catatan: login pelanggan di halaman toko berbasis no. HP yang cocok — bukan password sungguhan. Password admin juga dicek di browser, jadi ini penghalang praktis (bukan keamanan tingkat bank) — cukup supaya pelanggan yang kebetulan tahu URL /admin.html tidak bisa langsung melihat isinya.</div>`;

function logoutAdmin(){
  try{ sessionStorage.removeItem('bbbAdmin'); }catch(e){}
  location.reload();
}
function saveSetelan(){
  state.settings.bizName = document.getElementById('setBizName').value.trim() || DEFAULT_SETTINGS.bizName;
  state.settings.tagline = document.getElementById('setTagline').value.trim();
  state.settings.bizLocation = document.getElementById('setBizLocation').value.trim();
  state.settings.bizSocial = document.getElementById('setBizSocial').value.trim();
  state.settings.adminPhone = document.getElementById('setAdminPhone').value.trim();
  state.settings.shopeeLink = document.getElementById('setShopeeLink').value.trim();
  state.settings.bank = document.getElementById('setBank').value.trim();
  state.settings.rekening = document.getElementById('setRekening').value.trim();
  state.settings.atasnama = document.getElementById('setAtasnama').value.trim();
  state.settings.qrisMaxAmount = Number(document.getElementById('setQrisMax').value)||500000;
  state.settings.waAwal = document.getElementById('setWaAwal').value;
  state.settings.waPelunasan = document.getElementById('setWaPelunasan').value;
  saveSettings(); toast('Pengaturan disimpan'); render();
}

/* ---------- gerbang password admin ---------- */
const ADMIN_PASS = 'MinBagMinBig123';
function tryGate(){
  const val = document.getElementById('gatePass').value;
  if(val === ADMIN_PASS){
    try{ sessionStorage.setItem('bbbAdmin','1'); }catch(e){}
    document.getElementById('gate').style.display='none';
    loadAll();
  } else {
    document.getElementById('gateErr').textContent = 'Password salah.';
    document.getElementById('gatePass').value='';
  }
}
function bootAdmin(){
  let unlocked = false;
  try{ unlocked = sessionStorage.getItem('bbbAdmin')==='1'; }catch(e){}
  if(unlocked){ loadAll(); }
  else {
    document.getElementById('loading').style.display='none';
    document.getElementById('gate').style.display='flex';
    setTimeout(()=>{ const el=document.getElementById('gatePass'); if(el) el.focus(); }, 100);
  }
}

/* ---------- init ---------- */
bootAdmin();
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.autowrap')){
    const suggestOpen = document.querySelector('.suggest');
    if(suggestOpen && (state.liveBook===null||state.liveCustomer===null)){ /* leave as-is; suggestions close via selection or re-render */ }
  }
});
